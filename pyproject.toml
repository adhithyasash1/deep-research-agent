[project]
name = "deep-research-agent"
version = "0.1.0"
description = "Deep research agent: question → Gemini/Tavily → report → S3"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents",
    "tavily-python",
    "python-dotenv",
    "langchain-openrouter",
    "langchain-groq",
    "boto3",
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "helpers", "tools", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
