[project]
name = "deep-research-agent"
version = "0.1.0"
description = "Baseline Deep Agent research loop: question → agent → search → answer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents",
    "tavily-python",
    "python-dotenv",
    "langchain-openrouter",
    "langchain-groq",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
